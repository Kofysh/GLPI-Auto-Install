name: Ubuntu lifecycle integration

on:
  push:
    paths:
      - 'glpi-installer.sh'
      - '.github/workflows/ubuntu-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install GLPI on an ephemeral Ubuntu VM
        run: |
          sudo bash glpi-installer.sh --yes --glpi-version 11.0.9 --domain localhost
          test -f /var/www/glpi/bin/console
          test -f /root/.glpi_credentials
          sudo test -S /run/php/glpi-fpm.sock
          curl --fail --location --max-time 15 -o /dev/null http://127.0.0.1/
      - name: Back up and uninstall while retaining SQL and data
        run: |
          sudo bash glpi-installer.sh --uninstall --yes
          test ! -e /var/www/glpi
          sudo test -e /var/lib/glpi
          sudo test -e /root/.glpi_credentials
          sudo find /var/backups/glpi-installer -name SHA256SUMS -type f | grep -q .
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          sudo journalctl -u apache2 -u mariadb -u 'php*-fpm' -n 100 --no-pager || true
          sudo tail -n 100 /var/log/apache2/error.log || true
          sudo find /var/log/glpi-installer -type f -maxdepth 1 -print -exec tail -n 60 {} \; || true
